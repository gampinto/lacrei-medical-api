services:
  db:
    image: postgres:17
    container_name: lacrei-medical-db
    environment:
      POSTGRES_DB: lacrei_medical
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacrei -d lacrei_medical"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: lacrei-medical-web
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: poetry run python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data: