services:
  db:
    image: postgres:17
    container_name: lacrei-medical-db
    environment:
      POSTGRES_DB: lacrei_medical
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: lacrei-medical-web
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: